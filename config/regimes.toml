# Risk rules (regime-conditional)
[risk_rules]
# R04 and R07 block new longs unless confidence > 0.85
block_new_longs = ["R04", "R07"]
new_long_confidence_threshold = 0.85

# Entropy gate thresholds
entropy_soft_reduce = 0.75
entropy_hard_block = 0.90
