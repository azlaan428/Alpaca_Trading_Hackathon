# X Quant X Regime Definitions
# Authoritative source: alpaca_paper_trading_specifications_x_quant_x/027_xquantx_regime_archetypes.txt
# 
# This file defines the 12 canonical market regime archetypes as HMM states.
# The rule-based detector (regime_detector.py) provides a deterministic approximation;
# the HMM-based detector (hmm_regime_detector.py) is the authoritative implementation.

[regimes]
# Regime identifiers and semantic labels
R01 = "bull-quiet"
R02 = "bull-volatile"
R03 = "bear-trending"
R04 = "bear-capitulation"
R05 = "high-volatility"
R06 = "low-liquidity"
R07 = "macro-shock"
R08 = "correlation-breakdown"
R09 = "sector-rotation"
R10 = "mean-reversion"
R11 = "momentum-continuation"
R12 = "rate-hike-cycle"

# Bayesian prior probabilities (sum should approximate 1.0)
[priors]
R01 = 0.22
R02 = 0.15
R03 = 0.12
R04 = 0.04
R05 = 0.08
R06 = 0.05
R07 = 0.03
R08 = 0.04
R09 = 0.06
R10 = 0.07
R11 = 0.08
R12 = 0.06

# Minimum dwell time in bars before a regime transition is confirmed
[min_dwell_bars]
R01 = 3
R02 = 3
R03 = 3
R04 = 2
R05 = 3
R06 = 3
R07 = 2
R08 = 3
R09 = 3
R10 = 3
R11 = 3
R12 = 3

# Transition matrix diagonal elements (regime persistence)
[transition_diagonal]
R01 = 0.92
R02 = 0.87
R03 = 0.88
R04 = 0.72
R05 = 0.85
R06 = 0.78
R07 = 0.60
R08 = 0.80
R09 = 0.82
R10 = 0.86
R11 = 0.88
R12 = 0.85

# Emission distribution means (standardized feature space)
# Features are standardized (zero mean, unit variance) before HMM inference.
# These means are in standardized space and differentiate regimes by expected
# feature deviations from the observation window mean.
# Features: RSI, MACD, ATR, VIX, VolRatio, Corr, Hurst
[emission_mean.R01]
RSI = 1.0
MACD = 0.8
ATR = -0.5
VIX = -0.8
